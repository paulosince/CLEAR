name: Sdom — testes
on:
  push:
    paths: ['sdom/**', '.github/workflows/sdom-testes.yml']
  pull_request:
    paths: ['sdom/**', '.github/workflows/sdom-testes.yml']
jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdom
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regras do modelo, ambiente e regressão
        run: npm test
