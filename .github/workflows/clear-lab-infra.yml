name: CLEAR Laboratory infrastructure checks

on:
  push:
    branches:
      - feat/laboratorio-auth-neon-20261104
    paths:
      - 'lab/infra/**'
      - '.github/workflows/clear-lab-infra.yml'
  pull_request:
    paths:
      - 'lab/infra/**'
      - '.github/workflows/clear-lab-infra.yml'

permissions:
  contents: read

jobs:
  infra-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test lab/infra/tests/*.test.mjs
